#cloud-config
write_files:
  - path: /etc/ssh/sshd_config.d/99-hardened.conf
    permissions: '0600'
    content: |
      PermitRootLogin prohibit-password
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      X11Forwarding no
      AllowAgentForwarding no
      MaxAuthTries 3

runcmd:
  - systemctl restart ssh
  - |
    set -eu

    if ! command -v curl >/dev/null 2>&1; then
      apt-get update
      DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y ca-certificates curl
    fi

    curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION="v1.32.3+k3s1" INSTALL_K3S_EXEC="server --write-kubeconfig-mode 600 --secrets-encryption" sh -

    export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
    kubectl wait --for=condition=Ready node --all --timeout=180s

    bootstrap_dir=$(mktemp -d)
    trap 'rm -rf "$bootstrap_dir"' EXIT
    curl --retry 5 --retry-all-errors -fsSL -o "$bootstrap_dir/cert-manager.yaml" https://github.com/cert-manager/cert-manager/releases/download/v1.17.1/cert-manager.yaml &
    cert_manager_download_pid=$!
    curl --retry 5 --retry-all-errors -fsSL -o "$bootstrap_dir/argocd.yaml" https://raw.githubusercontent.com/argoproj/argo-cd/v2.14.11/manifests/install.yaml &
    argocd_download_pid=$!
    wait "$cert_manager_download_pid"
    wait "$argocd_download_pid"

    kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
    kubectl apply -f "$bootstrap_dir/cert-manager.yaml" &
    cert_manager_apply_pid=$!
    kubectl apply -n argocd -f "$bootstrap_dir/argocd.yaml" &
    argocd_apply_pid=$!
    wait "$cert_manager_apply_pid"
    wait "$argocd_apply_pid"

    kubectl wait --for=condition=Established crd/clusterissuers.cert-manager.io --timeout=180s
    kubectl wait --for=condition=Established crd/applications.argoproj.io --timeout=180s

    kubectl apply -f https://raw.githubusercontent.com/lmbek/lmbek-hobby-platform/main/argocd/production.yml
    kubectl apply -f https://raw.githubusercontent.com/lmbek/lmbek-hobby-platform/main/argocd/staging.yml
