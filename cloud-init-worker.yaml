#cloud-config
# ─────────────────────────────────────────────────────────────────────────────
# Cloud-init configuration for K3s Worker Node (Workload Pods)
# ─────────────────────────────────────────────────────────────────────────────

package_update: true
package_upgrade: true

packages:
  - curl
  - wget
  - git
  - jq
  - ufw
  - fail2ban
  - unattended-upgrades
  - ca-certificates
  - open-iscsi
  - nfs-common
  - iptables

write_files:
  - path: /etc/modules-load.d/k3s.conf
    permissions: '0644'
    content: |
      overlay
      br_netfilter

  - path: /etc/sysctl.d/99-kubernetes-k3s.conf
    permissions: '0644'
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1
      # Loose reverse-path filtering is required for multi-interface overlay networking.
      net.ipv4.conf.all.rp_filter         = 2
      net.ipv4.conf.default.rp_filter     = 2
      net.ipv4.icmp_echo_ignore_broadcasts = 1
      net.ipv4.conf.all.accept_source_route = 0
      net.ipv6.conf.all.accept_source_route = 0
      net.ipv4.conf.all.send_redirects    = 0
      net.ipv4.conf.default.send_redirects = 0
      net.ipv4.conf.all.accept_redirects  = 0
      net.ipv6.conf.all.accept_redirects  = 0
      net.ipv4.conf.all.secure_redirects  = 0
      net.ipv4.conf.default.secure_redirects = 0
      net.ipv4.conf.all.log_martians      = 1
      net.ipv4.conf.default.log_martians  = 1
      net.ipv4.tcp_syncookies             = 1
      fs.protected_hardlinks              = 1
      fs.protected_symlinks               = 1
      kernel.randomize_va_space           = 2
      kernel.kptr_restrict                = 2
      kernel.dmesg_restrict               = 1

  - path: /etc/ssh/sshd_config.d/99-hardened.conf
    permissions: '0600'
    content: |
      # Hardened SSH Configuration
      PermitRootLogin prohibit-password
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      ChallengeResponseAuthentication no
      PubkeyAuthentication yes
      X11Forwarding no
      AllowAgentForwarding no
      MaxAuthTries 3
      ClientAliveInterval 300
      ClientAliveCountMax 2
      LoginGraceTime 30
      Protocol 2

  - path: /etc/fail2ban/jail.d/ssh-hardened.local
    permissions: '0644'
    content: |
      [sshd]
      enabled = true
      port = 22
      filter = sshd
      logpath = /var/log/auth.log
      maxretry = 3
      findtime = 600
      bantime = 3600

  - path: /etc/apt/apt.conf.d/20auto-upgrades
    permissions: '0644'
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

runcmd:
  # Load kernel modules and apply sysctl settings
  - modprobe overlay
  - modprobe br_netfilter
  - sysctl --system

  # Configure and start fail2ban & reload hardened SSH
  - systemctl enable fail2ban
  - systemctl restart fail2ban
  - systemctl reload ssh || systemctl restart ssh

  # Wait for Terraform to attach the private NIC and discover its actual OS name.
  - |
    set -eu
    private_iface=""
    for attempt in $(seq 1 120); do
      private_iface=$(ip -o -4 addr show | awk -v ip="${worker_private_ip}" '$4 ~ ("^" ip "/") { print $2; exit }')
      if [ -n "$private_iface" ]; then
        break
      fi
      sleep 5
    done
    if [ -z "$private_iface" ]; then
      echo "Private address ${worker_private_ip} was not attached within 10 minutes" >&2
      exit 1
    fi
    printf '%s' "$private_iface" > /run/k3s-private-interface

    ufw default deny incoming
    ufw default allow outgoing
    ufw default allow routed
    ufw allow 22/tcp comment 'SSH'
    ufw allow 80/tcp comment 'HTTP (Traefik ServiceLB)'
    ufw allow 443/tcp comment 'HTTPS (Traefik ServiceLB)'
    ufw allow in on "$private_iface" comment 'Hetzner private network'
    ufw route allow in on "$private_iface" comment 'K3s private forwarding'
    ufw allow from 10.42.0.0/16 comment 'K3s pod network'
    ufw allow from 10.43.0.0/16 comment 'K3s service network'
    ufw --force enable

  # Wait for Master K3s API to become healthy on private network before joining
  - |
    set -eu
    echo "Waiting for Master API endpoint at https://${master_private_ip}:6443/ping..."
    ready=""
    for attempt in $(seq 1 120); do
      if curl -kfsS --connect-timeout 3 https://${master_private_ip}:6443/ping >/dev/null; then
        ready=true
        break
      fi
      sleep 5
    done
    if [ -z "$ready" ]; then
      echo "Master API did not become ready within 10 minutes" >&2
      exit 1
    fi
    private_iface=$(cat /run/k3s-private-interface)
    curl -sfL https://get.k3s.io | K3S_URL=https://${master_private_ip}:6443 K3S_TOKEN=${cluster_token} INSTALL_K3S_EXEC="agent --node-ip ${worker_private_ip} --flannel-iface $private_iface" sh -
