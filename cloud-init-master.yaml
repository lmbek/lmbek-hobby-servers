#cloud-config
# ─────────────────────────────────────────────────────────────────────────────
# Cloud-init configuration for K3s Master Node (Control Plane + Ingress + ArgoCD)
# ─────────────────────────────────────────────────────────────────────────────

package_update: true
package_upgrade: true

packages:
  - curl
  - wget
  - git
  - jq
  - ufw
  - fail2ban
  - ca-certificates
  - open-iscsi
  - nfs-common
  - iptables

write_files:
  - path: /etc/modules-load.d/k3s.conf
    permissions: '0644'
    content: |
      overlay
      br_netfilter

  - path: /etc/sysctl.d/99-kubernetes-k3s.conf
    permissions: '0644'
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1

runcmd:
  # Load kernel modules and apply sysctl settings
  - modprobe overlay
  - modprobe br_netfilter
  - sysctl --system

  # Configure UFW firewall
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp comment 'SSH'
  - ufw allow 80/tcp comment 'HTTP (Traefik Ingress)'
  - ufw allow 443/tcp comment 'HTTPS (Traefik Ingress)'
  - ufw allow in on eth1 comment 'Hetzner Private Network (Internal K3s API 6443 & Flannel)'
  - ufw --force enable

  # Install K3s control plane server bound to private network
  - >
    curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="server
    --token ${cluster_token}
    --node-ip ${master_private_ip}
    --advertise-address ${master_private_ip}
    --flannel-iface eth1
    --write-kubeconfig-mode 644
    --tls-san ${master_private_ip}
    --tls-san 127.0.0.1" sh -

  # Configure user environment for kubeconfig
  - mkdir -p /root/.kube
  - cp /etc/rancher/k3s/k3s.yaml /root/.kube/config
  - chmod 600 /root/.kube/config
