#cloud-config
# ─────────────────────────────────────────────────────────────────────────────
# Cloud-init configuration for K3s Master Node (Control Plane + Ingress + ArgoCD)
# ─────────────────────────────────────────────────────────────────────────────

package_update: true
package_upgrade: true

packages:
  - curl
  - wget
  - git
  - jq
  - ufw
  - fail2ban
  - unattended-upgrades
  - ca-certificates
  - open-iscsi
  - nfs-common
  - iptables

write_files:
  - path: /etc/modules-load.d/k3s.conf
    permissions: '0644'
    content: |
      overlay
      br_netfilter

  - path: /etc/sysctl.d/99-kubernetes-k3s.conf
    permissions: '0644'
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1
      net.ipv4.conf.all.rp_filter         = 1
      net.ipv4.conf.default.rp_filter     = 1
      net.ipv4.icmp_echo_ignore_broadcasts = 1
      net.ipv4.conf.all.accept_source_route = 0
      net.ipv6.conf.all.accept_source_route = 0
      net.ipv4.conf.all.send_redirects    = 0
      net.ipv4.conf.default.send_redirects = 0
      net.ipv4.conf.all.accept_redirects  = 0
      net.ipv6.conf.all.accept_redirects  = 0
      net.ipv4.conf.all.secure_redirects  = 0
      net.ipv4.conf.default.secure_redirects = 0
      net.ipv4.conf.all.log_martians      = 1
      net.ipv4.conf.default.log_martians  = 1
      net.ipv4.tcp_syncookies             = 1
      fs.protected_hardlinks              = 1
      fs.protected_symlinks               = 1
      kernel.randomize_va_space           = 2
      kernel.kptr_restrict                = 2
      kernel.dmesg_restrict               = 1

  - path: /etc/ssh/sshd_config.d/99-hardened.conf
    permissions: '0600'
    content: |
      # Hardened SSH Configuration
      PermitRootLogin prohibit-password
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      ChallengeResponseAuthentication no
      PubkeyAuthentication yes
      X11Forwarding no
      AllowAgentForwarding no
      MaxAuthTries 3
      ClientAliveInterval 300
      ClientAliveCountMax 2
      LoginGraceTime 30
      Protocol 2

  - path: /etc/fail2ban/jail.d/ssh-hardened.local
    permissions: '0644'
    content: |
      [sshd]
      enabled = true
      port = 22
      filter = sshd
      logpath = /var/log/auth.log
      maxretry = 3
      findtime = 600
      bantime = 3600

  - path: /etc/apt/apt.conf.d/20auto-upgrades
    permissions: '0644'
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

  - path: /etc/profile.d/k3s.sh
    permissions: '0755'
    content: |
      export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

runcmd:
  # Load kernel modules and apply sysctl settings
  - modprobe overlay
  - modprobe br_netfilter
  - sysctl --system

  # Configure and start fail2ban & reload hardened SSH
  - systemctl enable fail2ban
  - systemctl restart fail2ban
  - systemctl reload ssh || systemctl restart ssh

  # Configure UFW firewall
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp comment 'SSH'
  - ufw allow 80/tcp comment 'HTTP (Traefik Ingress)'
  - ufw allow 443/tcp comment 'HTTPS (Traefik Ingress)'
  - ufw allow in on eth1 comment 'Hetzner Private Network (Internal K3s API 6443 & Flannel)'
  - ufw --force enable

  # Install K3s control plane server bound to private network with secrets encryption
  - >
    curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="server
    --token ${cluster_token}
    --node-ip ${master_private_ip}
    --advertise-address ${master_private_ip}
    --flannel-iface eth1
    --write-kubeconfig-mode 644
    --secrets-encryption
    --tls-san ${master_private_ip}
    --tls-san 127.0.0.1" sh -

  # Wait for K3s to initialize and setup kubeconfig environment
  - >
    bash -c '
    echo "Waiting for K3s control plane to initialize..."
    for i in {1..60}; do
      if [ -f /etc/rancher/k3s/k3s.yaml ] && k3s kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml get nodes >/dev/null 2>&1; then
        echo "K3s is ready!"
        break
      fi
      sleep 2
    done
    mkdir -p /root/.kube
    cp /etc/rancher/k3s/k3s.yaml /root/.kube/config
    chmod 600 /root/.kube/config
    echo "KUBECONFIG=/etc/rancher/k3s/k3s.yaml" >> /etc/environment
    echo "export KUBECONFIG=/etc/rancher/k3s/k3s.yaml" >> /root/.bashrc
    '
